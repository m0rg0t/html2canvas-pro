name: Box-shadow correctness

on:
  push:
    branches: [test/box-shadow-regressions]
  pull_request:
    paths:
      - scripts/box-shadow-regressions.mjs
      - .github/workflows/box-shadow-regressions.yml
      - src/render/**
      - src/css/property-descriptors/box-shadow.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pixels:
    name: Native DOM comparison (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      SKIP_PREPARE: 'true'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      BOX_SHADOW_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned package manager
        run: corepack enable && corepack prepare pnpm@10.9.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the checked-out source
        run: pnpm build
      - name: Install browser and system dependencies
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Check test syntax
        run: node --check scripts/box-shadow-regressions.mjs
      - name: Compare box shadows against native DOM pixels
        run: node scripts/box-shadow-regressions.mjs
      - name: Preserve evidence even when correctness checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: box-shadow-${{ matrix.browser }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            tmp/box-shadow-regressions/
            scripts/box-shadow-regressions.mjs
            dist/html2canvas-pro.esm.js
      - name: Write summary
        if: always()
        run: |
          node --input-type=module -e '
          import {readFileSync, appendFileSync} from "node:fs";
          try {
            const r=JSON.parse(readFileSync("tmp/box-shadow-regressions/results.json", "utf8"));
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Box-shadow: ${process.env.BOX_SHADOW_BROWSERS}\n${r.summary.passed} passed; ${r.summary.failed} failed.\n\nCommit: ${r.metadata.gitRevision}\n\nDownload the artifact and open tmp/box-shadow-regressions/index.html for native/library/diff PNGs.\n`);
          } catch {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, "Tests did not produce results; inspect setup/build logs.\n");
          }'
